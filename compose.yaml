name: notion-ics-datetime
services:
  app:
    image: notion-ics-datetime-app
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      ORIGIN: ${ORIGIN:-http://localhost:3210}
    ports:
      - "127.0.0.1:3210:3000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
  cleanup:
    image: notion-ics-datetime-app
    restart: unless-stopped
    init: true
    command: ["node", "--experimental-strip-types", "scripts/cleanup.ts"]
    env_file: .env
    volumes:
      - cleanup-state:/app/state
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  cleanup-state:
