name: notion-ics-datetime
services:
  app:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      ORIGIN: http://localhost:3210
    ports:
      - "127.0.0.1:3210:3000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
